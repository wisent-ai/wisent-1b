[package]
name = "rej-1b"
version = "0.3.0"
edition = "2021"
description = "Rej-1B: a representation-native language model with explicit concept control"
license = "MIT"
readme = "README.md"
repository = "https://github.com/wisent-ai/wisent-1b"

[[bin]]
name = "rej-1b"
path = "src/main.rs"

[[test]]
name = "cli-journeys"
path = "tests/cli/training.rs"

[features]
default = []
metal = ["candle-core/metal", "candle-nn/metal"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[dependencies]
candle-core = "0.11.0"
candle-nn = "0.11.0"
clap = { version = "4.5.53", features = ["derive"] }
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2"
tokenizers = "0.22.1"
